services:
  - type: web
    name: v2ray-shop-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python v2ray_shop_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: API_KEY
        sync: false
